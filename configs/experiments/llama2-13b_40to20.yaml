# LLaMA-2-13B, 40 -> 20 layers (50%)
model: meta-llama/Llama-2-13b-hf
layer_config: llama-40to20           # see layer_curriculum/layer_selection.py
train_file: data/slimpajama/llama2/random_250000-1024   # scripts/prepare_slimpajama.py
block_size: 1024
use_flash_attn: true

extract:
  num_sample: 15000      # cached samples per segment
  quant: 8               # outlier-aware int8 feature cache
  gpus_per_model: 2      # GPUs holding one model copy during extraction

train:
  loss_func: cossim
  lr: 3.0e-4
  lr_scheduler: linear
  warmup_ratio: 0.005
  weight_decay: 1.0e-3
  beta1: 0.9
  beta2: 0.95
  grad_accum_steps: 1024
  adaptive: false        # true: convergence-aware adaptive schedule

curriculum:
  alpha: 0.035  

post_train:              # LoRA recovery stage (scripts/post_train.py)
  train_file: data/slimpajama/llama2/random_100000-1024
  lora: true             # rank 16, alpha 32, on the q/k/v/o projections
  lora_dropout: 0.1
  lr: 6.0e-5
  lr_scheduler: linear
  warmup_ratio: 0.005
  weight_decay: 1.0e-3
  beta1: 0.9
  beta2: 0.95
  adam_eps: 1.0e-5
  train_epoch: 1
  train_batch_size: 1    # per GPU
  global_batch_size: 32  # gradient accumulation is derived from the number of GPUs
