# Qwen2.5-7B, 28 -> 14 layers (50%)
model: Qwen/Qwen2.5-7B
layer_config: qwen2.5-7b_28to14           # see layer_curriculum/layer_selection.py
train_file: data/slimpajama/qwen/random_250000-1024   # scripts/prepare_slimpajama.py
block_size: 1024
use_flash_attn: true

extract:
  num_sample: 15000      # cached samples per segment
  quant: 8               # outlier-aware int8 feature cache
  gpus_per_model: 1      # GPUs holding one model copy during extraction

train:
  loss_func: cossim
  lr: 3.0e-4
  lr_scheduler: linear
  warmup_ratio: 0.005
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_accum_steps: 1024
  adaptive: false        # true: convergence-aware adaptive schedule 

curriculum:
  alpha: 0.035   

post_train:              # LoRA recovery stage (scripts/post_train.py)
  train_file: data/slimpajama/qwen/random_100000-1024
  lora: true             # rank 16, alpha 32, on the q/k/v/o projections
  lora_dropout: 0.1
  lr: 1.0e-4
  lr_scheduler: linear
  warmup_ratio: 0.005
  weight_decay: 1.0e-2
  beta1: 0.9
  beta2: 0.95
  adam_eps: 1.0e-5
  train_epoch: 1
  train_batch_size: 1    # per GPU
  global_batch_size: 32  # gradient accumulation is derived from the number of GPUs
